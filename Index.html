<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonit's Developer Portfolio & Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="ticker-wrap">
            <div class="ticker-item">🚀 Web and Mobile App Development Journey Has Officially Started! 🚀</div>
        </div>

        <h1>Welcome, I am Sonit!</h1>
        <p class="subtitle">Future Full-Stack & App Developer from Narela</p>

        <div class="profile-card">
            <button class="btn btn-primary" onclick="greetUser()">Click to Start</button>
        </div>

        <div class="game-card">
            <h2>🎯 Mini Game: Guess the Number</h2>
            <p>The computer has thought of a secret number between 1 and 10. Can you guess it?</p>
            <button class="btn btn-secondary" onclick="startGuessingGame()">Play Game</button>
            <div id="game-result" class="result-message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
